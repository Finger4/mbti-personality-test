events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use IP directly to bypass Docker DNS resolution
    # nginx=172.20.0.6, frontend=172.20.0.5, backend=172.20.0.4

    # HTTP server
    server {
        listen 80;
        server_name mbti.dhop.biz;

        # certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name mbti.dhop.biz;

        ssl_certificate /etc/letsencrypt/live/mbti.dhop.biz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mbti.dhop.biz/privkey.pem;

        # Frontend - use IP to bypass DNS
        location / {
            proxy_pass http://172.20.0.5:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend API - use IP to bypass DNS
        location /api/ {
            proxy_pass http://172.20.0.4:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # 新增：8088 端口直接访问前端（HTTP）
    server {
        listen 8088;
        server_name _;

        location / {
            proxy_pass http://172.20.0.5:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/ {
            proxy_pass http://172.20.0.4:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
