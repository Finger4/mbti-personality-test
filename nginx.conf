events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # HTTP server
    server {
        listen 80;
        server_name mbti.dhop.biz;

        # certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTP to HTTPS (will be added after certbot)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server (initially without SSL, certbot will update)
    server {
        listen 443 ssl;
        server_name mbti.dhop.biz;

        # SSL placeholder (certbot will fill these)
        # ssl_certificate /etc/letsencrypt/live/mbti.dhop.biz/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/mbti.dhop.biz/privkey.pem;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
